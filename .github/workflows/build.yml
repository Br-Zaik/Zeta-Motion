name: Compilar APK Zeta Motion

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar proyecto si se subió como ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f settings.gradle.kts && ! -f settings.gradle ]]; then
            zip_file="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
            if [[ -z "${zip_file}" ]]; then
              echo "No se encontró un proyecto Android ni un archivo ZIP."
              exit 1
            fi
            mkdir -p .zeta-unpack
            unzip -q -o "${zip_file}" -d .zeta-unpack
            project_root="$(find .zeta-unpack -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
            if [[ -z "${project_root}" ]]; then
              echo "El ZIP no contiene un proyecto Gradle Android válido."
              exit 1
            fi
            cp -a "${project_root}"/. .
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleRelease --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ZetaMotion-APK
          path: app/build/outputs/apk/release/*.apk
