name: Zeta Motion v36 - pruebas, APK y AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Elegir el código del proyecto
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/zeta-beta-public-only.jks ]] && grep -q 'betaPublicTestOnly' app/build.gradle.kts; then
            echo 'Proyecto localizado en la raíz del repositorio.'
          else
            # Si se sube un ZIP sin extraer, se usa el más reciente que contenga el proyecto.
            found=0
            while IFS= read -r archive; do
              rm -rf .zeta-temp
              mkdir -p .zeta-temp
              unzip -q -o "$archive" -d .zeta-temp || continue
              candidate="$(find .zeta-temp -type f -name zeta-beta-public-only.jks -print -quit)"
              if [[ -z "$candidate" ]]; then continue; fi
              root="$(dirname "$(dirname "$candidate")")"
              if [[ ! -f "$root/settings.gradle.kts" || ! -f "$root/app/build.gradle.kts" ]]; then continue; fi
              grep -q 'betaPublicTestOnly' "$root/app/build.gradle.kts" || continue
              cp -a "$root/app" .
              cp -a "$root/build.gradle.kts" "$root/settings.gradle.kts" "$root/gradle.properties" .
              echo "Código elegido desde: $archive"
              found=1
              break
            done < <(find . -maxdepth 2 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
            if (( found == 0 )); then
              echo '::error::No aparece el proyecto. Sube el ZIP o extrae todos sus archivos.'
              exit 1
            fi
          fi
          test -s app/zeta-beta-public-only.jks

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar API 36
        shell: bash
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Configurar Gradle compatible
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Firma privada SOLO si hay secretos completos
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ZETA_RELEASE_KEYSTORE_BASE64 }}
          ZETA_KEYSTORE_PASSWORD: ${{ secrets.ZETA_KEYSTORE_PASSWORD }}
          ZETA_KEY_ALIAS: ${{ secrets.ZETA_KEY_ALIAS }}
          ZETA_KEY_PASSWORD: ${{ secrets.ZETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            if [[ -z "$ZETA_KEYSTORE_PASSWORD" || -z "$ZETA_KEY_ALIAS" || -z "$ZETA_KEY_PASSWORD" ]]; then
              echo '::error::Faltan secretos de la firma privada. No se publicará un paquete ambiguo.'
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeta-private-signing.jks"
            echo "ZETA_KEYSTORE_PATH=$RUNNER_TEMP/zeta-private-signing.jks" >> "$GITHUB_ENV"
            echo 'Firma privada configurada: APK/AAB de com.zeta.fondo (Google Play).'
          else
            echo 'Sin firma privada: se compila Zeta Motion Beta (com.zeta.fondo.beta) con la clave pública de pruebas.'
          fi

      - name: Pruebas unitarias (lógica, bucles, contrato Kotlin-shader)
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee pruebas.log

      - name: Compilar APK y AAB firmados
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleRelease :app:bundleRelease 2>&1 | tee compilacion.log

      - name: Mostrar errores de Kotlin/Gradle como anotaciones
        if: failure()
        shell: bash
        run: |
          for f in pruebas.log compilacion.log; do
            [[ -f "$f" ]] || continue
            grep -E '^e: |error:|FAILED|What went wrong' "$f" | head -60 | while IFS= read -r line; do
              file="$(sed -n 's#^e: file://\(.*\.kt\):\([0-9]*\):\([0-9]*\).*#\1#p' <<< "$line")"
              ln="$(sed -n 's#^e: file://.*\.kt:\([0-9]*\):.*#\1#p' <<< "$line")"
              msg="${line//%/%25}"
              if [[ -n "$file" ]]; then
                rel="${file#$GITHUB_WORKSPACE/}"
                echo "::error file=$rel,line=$ln::$msg"
              else
                echo "::error::$msg"
              fi
            done
            grep -A3 'FAILED$' "$f" | head -40 || true
          done
          for r in app/build/test-results/testDebugUnitTest/*.xml; do
            [[ -f "$r" ]] || continue
            grep -o '<failure message="[^"]*"' "$r" | head -20 | sed 's/^/::error::Prueba fallida: /' || true
          done

      - name: Verificar firma, paquete e instalación
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$apk" || { echo '::error::No se creó app-release.apk firmado.'; exit 1; }
          test -s "$aab" || { echo '::error::No se creó app-release.aab.'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee firma.txt
          pkg="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          ver="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          # 16 KB: la app no incluye librerías nativas (.so), así que ya es compatible.
          if unzip -l "$apk" | grep -q '\.so$'; then echo '::warning::El APK contiene .so: revisar alineación de 16 KB.'; fi
          mkdir -p salida
          if [[ -n "${ZETA_KEYSTORE_PATH:-}" ]]; then
            expected='com.zeta.fondo'; tag='GOOGLE-PLAY'
          else
            expected='com.zeta.fondo.beta'; tag='BETA-PRUEBAS'
          fi
          if [[ "$pkg" != "$expected" ]]; then
            echo "::error::Paquete inesperado: $pkg (esperado: $expected)"
            exit 1
          fi
          cp "$apk" "salida/ZetaMotion-v${ver}-${tag}.apk"
          cp "$aab" "salida/ZetaMotion-v${ver}-${tag}.aab"
          {
            echo '### ✅ Zeta Motion compilado, probado y firmado'
            echo "**Versión:** $ver  ·  **Paquete:** $pkg"
            echo ''
            echo '- Pruebas unitarias: superadas'
            echo '- APK: instalar desde Archivos (extraer primero del ZIP del artefacto).'
            if [[ -n "${ZETA_KEYSTORE_PATH:-}" ]]; then
              echo '- AAB: listo para subir a Google Play Console (Play App Signing).'
            else
              echo '- AAB beta: solo de prueba. Para Google Play configura los 4 secretos ZETA_* (ver LEEME_V36.md).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK y AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZetaMotion-v36-APK-AAB
          path: salida/*
          if-no-files-found: error

      - name: Subir registros si hay fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ZetaMotion-registros-error
          path: |
            pruebas.log
            compilacion.log
            app/build/reports/tests/
          if-no-files-found: ignore
